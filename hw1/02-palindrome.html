<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>02 - Palindrome</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
    />
    <script defer src="02-palindrome.js"></script>
    <style>
      body {
        background-color: #0d6efd;
      }

      section {
        max-width: 545px;
        margin: 60px auto;
        padding: 32px 20px 24px;
        background-color: #f8f9fa;
        border-radius: 4px;
        box-shadow: 0 0 4px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin-bottom: 32px;
      }

      label {
        margin-right: 4px;
      }

      .result-success {
        color: #146c2e;
        font-weight: 600;
      }

      .result-error {
        color: #b02a37;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>Exercise 02 - Palindrome</h1>

        <div class="d-flex align-items-center mb-4">
          <label for="numberInput" class="me-1">Enter a positive number:</label>
          <input
            id="numberInput"
            class="form-control w-50"
            type="number"
            min="1"
            step="1"
          />
        </div>

        <div>
          <p class="mb-3">Is this a palindrome?</p>
          <div id="result" aria-live="polite"></div>
        </div>
      </section>
    </main>
  </body>
</html>
