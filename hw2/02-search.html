<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>02 - Search</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
    />
    <script defer src="02-data.js"></script>
    <script defer src="02-search.js"></script>
  </head>
  <body class="bg-dark">
    <main class="container bg-light rounded mt-5 p-4 text-center">
      <h1 class="mb-4">Exercise 02 - Search</h1>
      <div class="mb-5">
        <label for="userInput" class="visually-hidden">Search: </label>
        <input
          type="text"
          id="userInput"
          class="form-control d-inline-block w-auto"
          placeholder="Enter a character name"
        />
        <input
          type="button"
          id="searchButton"
          class="btn btn-primary"
          value="Search"
        />
      </div>
      <div
        id="results"
        class="d-flex flex-wrap justify-content-center gap-2"
      ></div>
    </main>
  </body>
</html>
