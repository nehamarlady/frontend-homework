<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>04 - Background</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
    />
    <script defer src="04-background.js"></script>
  </head>
  <body>
    <main
      id="backgroundArea"
      class="container my-4 p-5"
      style="max-width: 1100px; min-height: 625px"
    >
      <div class="card bg-light mx-auto p-3 p-md-4" style="max-width: 570px">
        <h1 class="mb-4">Exercise 04 - Background</h1>
        <p>
          The background color will change every few seconds (as indicated
          below). You can stop this behavior and you can also change how often
          the background color changes.
        </p>
        <div class="mb-4">
          <label>Background change interval (seconds): </label>
          <input
            type="number"
            id="intervalInput"
            class="form-control"
            min="1"
            step="1"
            style="max-width: 240px"
          />
        </div>
        <div>
          <input
            type="button"
            id="toggleButton"
            class="btn btn-danger"
            value="Start"
          />
        </div>
      </div>
    </main>
  </body>
</html>
