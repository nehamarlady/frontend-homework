<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>05 - Form</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
    />
    <script defer src="05-form.js"></script>
  </head>
  <body>
    <main
      class="container-fluid bg-dark p-4 my-3"
      style="max-width: 1100px; min-height: 950px"
    >
      <form
        id="registrationForm"
        class="card bg-light p-3 p-md-4 mx-auto mt-4"
        style="max-width: 550px"
      >
        <h1 class="text-center mb-4">Exercise 05 - Form</h1>
        <div class="mb-3">
          <label for="fullName" class="form-label fw-bold">Full Name:</label>
          <input
            type="text"
            class="form-control"
            id="fullName"
            name="fullName"
          />
        </div>

        <div class="mb-3">
          <label for="email" class="form-label fw-bold">Email:</label>
          <input type="email" class="form-control" id="email" name="email" />
        </div>

        <div class="mb-3">
          <label for="registrationStatus" class="form-label fw-bold">
            Registration Status:
          </label>
          <select
            class="form-select"
            id="registrationStatus"
            name="registrationStatus"
          >
            <option value="" selected disabled>Choose an Option</option>
            <option value="Registered">Registered</option>
            <option value="Not Registered">Not Registered</option>
            <option value="Waitlisted">Waitlisted</option>
          </select>
        </div>

        <fieldset class="mb-3">
          <legend class="fs-6 fw-bold">
            Have you taken any of the following courses?
          </legend>

          <div class="form-check">
            <input
              class="form-check-input"
              type="checkbox"
              id="programming"
              name="courses"
              value="Programming Languages"
            />
            <label class="form-check-label" for="programming">
              Programming Languages
            </label>
          </div>

          <div class="form-check">
            <input
              class="form-check-input"
              type="checkbox"
              id="operatingSystems"
              name="courses"
              value="Operating Systems"
            />
            <label class="form-check-label" for="operatingSystems">
              Operating Systems
            </label>
          </div>

          <div class="form-check">
            <input
              class="form-check-input"
              type="checkbox"
              id="webDevelopment"
              name="courses"
              value="Full Stack Web Development"
            />
            <label class="form-check-label" for="webDevelopment">
              Full Stack Web Development
            </label>
          </div>
        </fieldset>

        <div class="mb-4">
          <label for="anythingElse" class="form-label fw-bold">
            Anything else?
          </label>
          <textarea
            class="form-control"
            id="anythingElse"
            name="anythingElse"
            rows="3"
          ></textarea>
        </div>

        <div class="d-flex gap-1">
          <button type="submit" class="btn btn-primary flex-fill">
            Submit
          </button>
          <button type="reset" class="btn btn-secondary flex-fill">
            Reset
          </button>
        </div>
      </form>
    </main>

    <!-- Modal for displaying submitted information -->
    <div
      class="modal fade"
      id="resultModal"
      tabindex="-1"
      aria-labelledby="resultModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="resultModalLabel">
              Submitted Information
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body" id="modalBody"></div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-primary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
